name: 24/7 Autonomous Govt Exam Shorts Pipeline

on:
  schedule:
    # Runs twice daily at 03:00 and 15:00 UTC (08:30 AM and 08:30 PM IST) completely autonomously
    - cron: '0 3,15 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to schedule ahead'
        required: false
        default: '2'
      slots_per_day:
        description: 'Publishing slots per day'
        required: false
        default: '3'
      duration:
        description: 'Video duration in seconds (15-30s)'
        required: false
        default: '15.0'
      live_publish:
        description: 'Execute live API upload (true/false)'
        type: boolean
        required: false
        default: true
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'renderer.py'
      - 'scraper.py'
      - 'scheduler.py'
      - 'run_pipeline.py'

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials & Environment
        env:
          YOUTUBE_CLIENT_SECRETS_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRETS_BASE64 }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -n "$YOUTUBE_CLIENT_SECRETS_BASE64" ]; then
            echo "$YOUTUBE_CLIENT_SECRETS_BASE64" | base64 -d > client_secrets.json
            echo "client_secrets.json restored from secrets."
          fi
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 -d > youtube_token.json
            echo "youtube_token.json restored from secrets."
          fi

      - name: Execute Autonomous Shorts Pipeline (2 Days Schedule)
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          DAYS="${{ github.event.inputs.days || '2' }}"
          SLOTS="${{ github.event.inputs.slots_per_day || '3' }}"
          DURATION="${{ github.event.inputs.duration || '15.0' }}"
          LIVE="${{ github.event.inputs.live_publish || 'true' }}"

          EXTRA_ARGS=""
          if [ "$LIVE" = "true" ] || [ -n "$META_PAGE_ACCESS_TOKEN" ] || [ -f "youtube_token.json" ]; then
            EXTRA_ARGS="--live-publish"
          fi

          echo "Running autonomous pipeline in cloud for $DAYS day(s) with $SLOTS slot(s)/day..."
          python run_pipeline.py --days $DAYS --slots-per-day $SLOTS --duration $DURATION $EXTRA_ARGS

      - name: Upload Generated Videos & Posters Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-exam-shorts-bundle
          path: |
            output/*.mp4
            output/*.jpg
            output/pipeline_summary_*.json
          retention-days: 14

      - name: Commit & Push Updated Pipeline State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pipeline_state.json data/scraped/ output/pipeline_summary_*.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(pipeline): update state and scheduled slots [skip ci]"
            git push
          fi
